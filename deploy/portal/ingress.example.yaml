# OPTIONAL example: replace hostname, class and TLS Secret; obtain a valid certificate first.
# Your controller must redirect HTTP to HTTPS and allow streaming responses.
# It is NOT included by scripts/render-portal.py.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-desk
  namespace: ax-system
spec:
  ingressClassName: traefik
  tls:
  - hosts: [agent-desk.example.com]
    secretName: agent-desk-tls
  rules:
  - host: agent-desk.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agent-desk-portal
            port: {number: 8080}
---
# Replace selectors to match ONLY your intended ingress controller.
# Both selectors in the same entry are an AND, not an OR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-desk-from-ingress
  namespace: ax-system
spec:
  podSelector: {matchLabels: {app: agent-desk-portal}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
    ports: [{protocol: TCP, port: 8080}]
